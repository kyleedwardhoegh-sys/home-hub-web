<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hoegh Training Hub</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Training" />
<meta name="theme-color" content="#2B1838" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Always-there navigation for phones, iPads and browsers. Hidden on the kitchen
     kiosk (?kiosk=1), which has its own native Back / Home / Exit corner pills. -->
<nav id="app-nav" class="app-nav" aria-label="Navigation">
  <button id="nav-back" class="nav-btn" type="button">&larr; Back</button>
  <button id="nav-home" class="nav-btn" type="button">&#8962; Home</button>
  <span class="nav-spacer"></span>
  <button id="nav-fs" class="nav-btn" type="button" hidden>&#x26F6; Full screen</button>
</nav>

<div id="demo-banner" class="demo-banner" hidden>Preview mode: sample data, nothing is saved.</div>

<!-- PLAYER SELECT -->
<section id="view-select" class="view active">
  <h1 class="select-title">Who's training?</h1>
  <div id="player-grid" class="player-grid"></div>
  <p id="select-status" class="muted center">Loading players…</p>
</section>

<!-- HUB -->
<section id="view-hub" class="view">
  <header class="hub-head">
    <div class="hub-title">
      <div id="hub-name" class="hub-name"></div>
      <div id="hub-date" class="muted"></div>
    </div>
    <div class="today-pill"><b id="today-pts">0</b> achievements today</div>
  </header>

  <section id="cal-strip" class="cal-strip" hidden></section>

  <section class="prize-zone">
    <div class="prize-card prize-weekly">
      <div class="prize-top">
        <div>
          <div class="eyebrow">This week</div>
          <div id="weekly-prize" class="prize-name"></div>
        </div>
        <button id="btn-visual" class="btn-ghost small">Switch to thermometer</button>
      </div>
      <div id="weekly-visual" class="visual"></div>
      <div id="weekly-label" class="prize-label"></div>
    </div>
    <div class="prize-card prize-big">
      <div class="prize-top">
        <div>
          <div class="eyebrow">Big prize</div>
          <div id="big-prize" class="prize-name"></div>
        </div>
      </div>
      <div id="big-visual" class="visual small"></div>
      <div id="big-label" class="prize-label"></div>
    </div>
  </section>

  <nav id="track-tabs" class="track-tabs" role="tablist"></nav>

  <section id="track-body"></section>
</section>

<!-- VIDEO -->
<div id="video-overlay" class="overlay" hidden>
  <div class="video-card">
    <div id="video-slot" class="video-slot"></div>
    <button id="video-close" class="btn-primary">Close video</button>
  </div>
</div>

<!-- BOOM -->
<div id="boom-overlay" class="overlay boom" hidden>
  <div class="boom-card">
    <div id="boom-burst" class="boom-burst"></div>
    <div id="boom-title" class="boom-title">BOOM!</div>
    <div id="boom-prize" class="boom-prize"></div>
    <p class="boom-note">Show Dad to claim it.</p>
    <button id="boom-close" class="btn-primary">Awesome!</button>
  </div>
</div>

<canvas id="confetti" hidden></canvas>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
